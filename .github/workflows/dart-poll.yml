name: DART 공시 폴링

# Vercel Cron(Hobby 플랜)은 하루 1회만 실행할 수 있어서, 장중 폴링은
# GitHub Actions 스케줄로 /api/cron/dart-poll을 호출한다.
# 한국 장중(09:00~15:40 KST) = UTC 00:00~06:40, 10분 간격.
on:
  schedule:
    - cron: "*/10 0-6 * * 1-5"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: DART 공시 폴링 요청
        run: |
          curl -sf -X POST "https://stock-advisor2.vercel.app/api/cron/dart-poll" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
